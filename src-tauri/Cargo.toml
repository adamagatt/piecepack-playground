[package]
name = "piecepack-playground"
version = "0.1.0"
description = "Piecepack Playground — Piece Pack catalog (Tauri shell)"
authors = ["you"]
edition = "2021"

[lib]
name = "piecepack_playground_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
